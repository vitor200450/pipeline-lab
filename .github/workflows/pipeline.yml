name: "Estrutura de Diretórios e Arquivos"

on:
    push:
        branches: [main]
    workflow_dispatch:

env:
    NODE_VERSION: "18"

jobs:
    demonstrar-estrutura:
        name: "Demonstrar Estrutura Básica"
        runs-on: ubuntu-latest

        steps:
            - name: Checkout do código
              uses: actions/checkout@v4
            
            - name: Mostrar estrutura .github/workflows
              run: |
                echo "================================================"
                echo "ESTRUTURA DO DIRETÓRIO .github/workflows"
                echo "================================================"
                ls -la .github/workflows/
                echo ""
                echo "Total de workflows: $(ls -l .github/workflows/*.y*ml 2> /dev/null | wc -l)"

            - name: Elementos obrigatórios do workflow
              run: |
                echo "================================================"
                echo "ELEMENTOS OBRIGATÓRIOS DO WORKFLOW"
                echo "================================================"
                echo "1. name: Nome do workflow"
                echo "2. on: Eventos de trigger (push, workflow_dispatch)"
                echo "3. jobs: Tarefas a executar"
                echo "4. steps: Passos a serem executados"
                echo "5. uses: Ações a serem usadas"
                echo "6. run: Comandos a serem executados"
                echo "7. env: Variáveis de ambiente"
                echo "8. secrets: Segredos a serem usados"
                echo "9. permissions: Permissões a serem usadas"
                echo "10. concurrency: Concorrência a serem usadas"
                echo "11. outputs: Saídas a serem usadas"
                echo "12. secrets: Segredos a serem usados"
            
            - name: Variáveis e contextos
              run: |
                echo "================================================"
                echo "VARIÁVEIS E CONTEXTOS"
                echo "================================================"
                echo "Variável env: ${{ env.NODE_VERSION }}"      # Acessa variável de ambiente
                echo "Repositório: ${{ github.repository }}"      # Contexto do GitHub
                echo "Branch: ${{ github.ref_name }}"             # Nome da branch
                echo "Actor: ${{ github.actor }}"                 # Usuário que disparou o workflow