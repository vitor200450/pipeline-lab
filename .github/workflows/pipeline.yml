name: Issue Trigger Workflow
permissions:
  issues: write

on:
  issues:
    types: [opened, edited, closed, labeled]
  
jobs:
  issue-job:
    runs-on: ubuntu-latest

    steps:
      - name: Informações do issue
        run: |
          echo "================================================"
          echo "INFORMAÇÕES DO ISSUE"
          echo "================================================"
          echo "Ação: ${{ github.event.action }}"
          echo "Issue: ${{ github.event.issue.number }}"
          echo "Título: ${{ github.event.issue.title }}"
          echo "Autor: ${{ github.event.issue.user.login }}"
          echo "Labels: ${{ github.event.issue.labels }}"
          echo "================================================"
      
      - name: Resposta automática (nova issue)
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            github.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Obrigado por criar este issue! Estamos trabalhando para resolver o problema.'
            });