name: Scheduler Trigger Workflow

on:
  schedule:
    # Executa às 16:55 no horário do Brasil
    - cron: '55 19 * * *'
  workflow_dispatch:

jobs:
  scheduled-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      
      - name: Informações do schedule
        run: |
          echo "================================================"
          echo "Workflow disparado por schedule"
          echo "Data atual: $(date)"
          echo "Hora UTC: $(date -u +%H:%M)"
          echo "Timezone: $(date +%Z)"
          echo "================================================"
      
      - name: Relatório diário automatizado
        run: |
          echo "================================================"
          echo "RELATÓRIO DIÁRIO AUTOMATIZADO"
          echo "================================================"
          echo "Total de commits: $(git rev-list --all --count)"
          echo "Contribuidores únicos: $(git log --format='%aN' | sort -u | wc -l)"
          echo "Último commit: $(git log -1 --pretty=format:'%h - %s')
          echo "================================================"