name: Hello GitHub Actions!

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]
    workflow_dispatch:
    

jobs:
    hello-job:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout do código
              uses: actions/checkout@v4
            
            - name: Executar um Hello World
              run: echo "Hello, GitHub Actions!"

            - name: Mostrar informações do sistema
              run: |
                echo "Sistema operacional: ${{ runner.os }}"
                echo "Diretório atual: $(pwd)"
                echo "Data e hora: $(date)"
                echo "Usuário: $(whoami)"

            - name: Listar arquivos do repositório
              run: ls -la
            
            - name: Comandos múltiplos
              run: |
                echo "Este é o Lab 02 do curso de GitHub Actions"
                echo "O workflow foi executado com sucesso"
                echo "Pronto para as próximas etapas!"